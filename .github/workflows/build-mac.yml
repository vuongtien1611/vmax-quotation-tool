name: Build macOS DMG

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS DMGs (Apple Silicon & Intel)
    runs-on: macos-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build macOS Application (Apple Silicon arm64)
        run: |
          echo "Starting build for arm64..."
          npx electron-builder --mac dmg zip --arm64 -c.mac.identity=null

      - name: Build macOS Application (Intel x64)
        run: |
          echo "Starting build for x64..."
          npx electron-builder --mac dmg zip --x64 -c.mac.identity=null

      - name: List generated build artifacts
        run: |
          echo "=== Generated Artifacts in dist/ ==="
          ls -lh dist/

      - name: Upload DMG & ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VMAX-Quotation-Mac-Apps
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30
          if-no-files-found: error
