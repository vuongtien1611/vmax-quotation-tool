name: Build macOS DMG

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS DMGs (Apple Silicon & Intel)
    runs-on: macos-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build DMG for Apple Silicon (M1/M2/M3/M4 - arm64)
        run: npm run build:dmg:arm64

      - name: Build DMG for Intel (x64)
        run: npm run build:dmg:x64

      - name: List generated build artifacts
        run: |
          echo "=== Generated DMG Files ==="
          ls -lh dist/*.dmg

      - name: Upload DMG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VMAX-Quotation-Mac-DMGs
          path: dist/*.dmg
          retention-days: 30
          if-no-files-found: error
