name: Build macOS DMG

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS DMGs (Apple Silicon & Intel)
    runs-on: macos-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Apple native .icns iconset
        run: |
          echo "Generating native Apple ICNS using sips and iconutil..."
          mkdir -p icon.iconset
          sips -z 16 16     assets/logo-vmax.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/logo-vmax.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/logo-vmax.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/logo-vmax.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/logo-vmax.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/logo-vmax.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/logo-vmax.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/logo-vmax.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/logo-vmax.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/logo-vmax.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o assets/icon.icns
          rm -rf icon.iconset
          ls -lh assets/icon.icns

      - name: Build macOS Application (Apple Silicon arm64)
        run: |
          echo "Building arm64 DMG and ZIP..."
          npx electron-builder --mac dmg zip --arm64 -c.mac.identity=null 2>&1 | tee build-arm64.log

      - name: Build macOS Application (Intel x64)
        run: |
          echo "Building x64 DMG and ZIP..."
          npx electron-builder --mac dmg zip --x64 -c.mac.identity=null 2>&1 | tee build-x64.log

      - name: List generated build artifacts
        run: |
          echo "=== Generated Artifacts in dist/ ==="
          ls -lh dist/

      - name: Upload Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"

      - name: Upload DMG & ZIP Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VMAX-Quotation-Mac-Apps
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publish Direct Download GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "VMAX Quotation Builder v1.0.0 for macOS"
          body: |
            ## VMAX Quotation Builder - Ứng dụng Desktop Báo Giá Chuyên Nghiệp

            Tải trực tiếp file cài đặt dành cho MacBook (macOS):
            - **[VMAX-Quotation-Builder-Mac-arm64.dmg](https://github.com/vuongtien1611/vmax-quotation-tool/releases/download/v1.0.0/VMAX-Quotation-Builder-Mac-arm64.dmg)**: Dành cho MacBook chip **Apple Silicon (M1, M2, M3, M4...)**.
            - **[VMAX-Quotation-Builder-Mac-x64.dmg](https://github.com/vuongtien1611/vmax-quotation-tool/releases/download/v1.0.0/VMAX-Quotation-Builder-Mac-x64.dmg)**: Dành cho MacBook đời cũ chạy chip **Intel**.

            *Ứng dụng chạy độc lập 100% offline, tích hợp đầy đủ tính năng tạo báo giá, xuất file PDF, lưu trữ và sao lưu dữ liệu.*
          draft: false
          prerelease: false
          files: |
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
